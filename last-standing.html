function ai(b,dt){

 else if(en){const dx=en.x-b.x,dz=en.z-b.z,d=M.hypot(dx,dz)||1,st=M.sin(T*.7+b.id*2)>0?1:-1,f=d>22?1:d<9?-1:0;fy=M.atan2(-dx,-dz);mx=f*dx/d-dz/d*st*.6;mz=f*dz/d+dx/d*st*.6;sp=3.6}

function update(dt){T+=dt;
 for(const e of ents){if(!e.alive)continue;e.cool-=dt;if(e.rel>0){e.rel-=dt;if(e.rel<=0){const n=M.min(W[e.w].mag-e.mag,e.res);e.mag+=n;e.res-=n;e.rel=0}}}
 near=null;let nd=2.6;for(const l of loot){l.m.rotation.y+=dt*1.5;const d=M.hypot(l.x-P.x,l.z-P.z);if(d<nd){nd=d;near=l}}
 const w=W[P.w];let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+jx,mz=(keys.KeyW?1:0)-(keys.KeyS?1:0)+jy;const ml=M.hypot(mx,mz);if(ml>1){mx/=ml;mz/=ml}

}

 $('zt').textContent=Z.shr?'المنطقة تتقلص':Z.ph<5?'تتقلص بعد '+M.ceil(Z.t)+' ث':'الدائرة الأخيرة';
